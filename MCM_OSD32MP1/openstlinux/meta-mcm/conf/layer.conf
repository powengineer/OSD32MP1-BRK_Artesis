# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-mcm"
BBFILE_PATTERN_meta-mcm = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mcm = "6"

LAYERDEPENDS_meta-mcm = "core"
LAYERSERIES_COMPAT_meta-mcm = "scarthgap"
